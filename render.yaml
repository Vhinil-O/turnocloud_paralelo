databases:
  - name: turnocloud-db
    databaseName: turnocloud
    user: turnocloud_user
    plan: free

services:
  - type: web
    name: turnocloud-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    branch: master
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: turnocloud-db
          property: connectionString