name: CI - Verificacion de Calidad

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

jobs:
  verify:
    name: Lint, Typecheck, Tests y Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: turnocloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter
        run: npm run lint

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Ejecutar pruebas de integracion
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/turnocloud_test
        run: npm test

      - name: Compilar proyecto (Build)
        run: npm run build