services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: turnocloud
      POSTGRES_PASSWORD: turnocloud_pass
      POSTGRES_DB: turnocloud_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/01-migrations
      - ./database/seeds:/docker-entrypoint-initdb.d/02-seeds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnocloud -d turnocloud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://turnocloud:turnocloud_pass@db:5432/turnocloud_db
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3001
    depends_on:
      - api

volumes:
  pgdata: