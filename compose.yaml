services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: turnocloud
      POSTGRES_PASSWORD: turnocloud_pass
      POSTGRES_DB: turnocloud_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_create_services.sql:/docker-entrypoint-initdb.d/01_create_services.sql
      - ./database/migrations/002_create_operators.sql:/docker-entrypoint-initdb.d/02_create_operators.sql
      - ./database/migrations/003_create_tickets.sql:/docker-entrypoint-initdb.d/03_create_tickets.sql
      - ./database/migrations/004_create_ticket_logs.sql:/docker-entrypoint-initdb.d/04_create_ticket_logs.sql
      - ./database/seeds/001_initial_data.sql:/docker-entrypoint-initdb.d/05_initial_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnocloud -d turnocloud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://turnocloud:turnocloud_pass@db:5432/turnocloud_db
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3001
    depends_on:
      - api

volumes:
  pgdata: